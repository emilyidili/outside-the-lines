[build]
  publish = "."
  command = "node build-products.js"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/products.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
