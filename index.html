h2{font-size:clamp(1.9rem,4vw,2.9rem)}
h3{font-size:1.4rem;font-weight:400}
p{margin:0}
a{color:var(--link)}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:max(16px,4vw)}
.muted{color:var(--muted)}
.label{font-size:.82rem;letter-spacing:.18em;color:var(--muted)}
.eyebrow{font-size:.9rem;letter-spacing:.28em;color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
main,footer.site{position:relative;z-index:1}

.watermark{position:fixed;inset:0;z-index:0;pointer-events:none;display:grid;place-items:center;color:var(--fg);opacity:var(--mark);overflow:hidden}
.watermark svg{width:min(920px,130vw);aspect-ratio:283.46/249.69;height:auto}

.proto{background:var(--note-bg);color:var(--note-fg);font-size:.78rem;letter-spacing:.03em;text-align:center;padding:7px 16px}

.band{--fg:#f3f8fa;--muted:rgba(243,248,250,.84);--link:#bfece6;--line:rgba(255,255,255,.22);--line-strong:rgba(255,255,255,.5);--accent:#3cada6;--accent-fg:#04141c;--accent-hover:#7fd9d2;color:#f3f8fa;position:relative;overflow:hidden}
.band>.wrap{position:relative;z-index:1}
.band.blue{background:var(--tex-wave-soft),var(--tex-grain),var(--g-blue);background-size:720px 240px,180px 180px,auto}
.band.hero-band{background:var(--tex-wave),var(--tex-grain),var(--g-hero);background-size:720px 240px,180px 180px,auto}
.band.page-band{background:var(--tex-wave-soft),var(--tex-grain),var(--g-page);background-size:720px 240px,180px 180px,auto}
.band.teal{background:var(--tex-wave),var(--tex-grain),var(--g-teal);background-size:720px 240px,180px 180px,auto}
.band-logo{position:absolute;right:-5%;top:50%;transform:translateY(-50%);width:min(640px,86vw);aspect-ratio:283.46/249.69;color:#fff;opacity:.07;z-index:0;pointer-events:none}
.band.blue>.wrap,.band.teal>.wrap{padding-block:clamp(44px,7vw,92px)}
.band.page-band>.wrap{padding-block:clamp(28px,5vw,56px)}
.stripe{height:3px;opacity:.85;background:linear-gradient(90deg,#3cada6 0 25%,#19819a 25% 50%,#16508f 50% 75%,#273476 75%)}

header.site{--fg:#ffffff;--muted:rgba(255,255,255,.82);--line-strong:rgba(255,255,255,.55);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0d1634;border-bottom:1px solid rgba(60,173,166,.55);color:#fff}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:14px;font-size:1.05rem;line-height:1;letter-spacing:.2em;color:var(--fg);text-decoration:none;margin-right:auto}
.logo{display:block;flex:none;color:var(--fg)}
.logo.sm{height:50px;width:57px}
.logo.lg{height:116px;width:132px}
nav.main{display:flex;gap:4px}
nav.main a{padding:8px 12px;color:var(--fg);text-decoration:none;font-size:.88rem;letter-spacing:.22em;border-bottom:2px solid transparent}
nav.main a:hover,nav.main a[aria-current="page"]{border-bottom-color:#3cada6}
.count{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding-inline:.4em;margin-left:10px;border-radius:999px;background:#3cada6;color:#04141c;font:500 .78rem var(--font-body);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.88rem;line-height:1.2;letter-spacing:.2em;padding:14px 24px;border-radius:0;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.lg{padding:17px 32px;font-size:.95rem}
.btn.block{width:100%}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:center;padding-block:clamp(48px,8vw,110px)}
.hero-copy{display:grid;gap:24px;justify-items:start}
.hero .eyebrow{color:#bfece6}
.lead{font-size:1.12rem;max-width:31em;color:var(--muted)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.frame{position:relative;aspect-ratio:1/1.02;max-width:100%}
.frame::before{content:"";position:absolute;inset:calc(var(--bleed)*-1) var(--bleed) var(--bleed) calc(var(--bleed)*-1);border:1.5px solid rgba(255,255,255,.65);z-index:0}
.frame img{display:block}
.frame .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:var(--tile)}
.frame .a2{position:absolute;z-index:2;right:calc(var(--bleed)*-1);bottom:calc(var(--bleed)*-1);width:48%;aspect-ratio:4/3;object-fit:cover;border:5px solid #fff}
.tile svg{display:block;width:100%;height:auto}

.sec>.wrap{padding-block:clamp(44px,7vw,92px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px 40px;flex-wrap:wrap;margin-bottom:36px}
.sec-head>div{display:grid;gap:12px}
.sec-head>p{max-width:34em;color:var(--muted)}
.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.products{grid-template-columns:repeat(auto-fit,minmax(280px,400px));justify-content:start}
.link-tile,.card{display:flex;flex-direction:column;background:var(--surface);color:var(--fg);border:1px solid var(--line);overflow:hidden;text-decoration:none;min-width:0;--muted:#a9bccb}
:root[data-theme="light"] .link-tile,:root[data-theme="light"] .card{--muted:#4a6178;--link:#16508f}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .link-tile,:root:not([data-theme="dark"]) .card{--muted:#4a6178;--link:#16508f}}
.link-tile:hover{border-color:var(--teal)}
.rbar{height:6px;flex:none}
.bar-brand{background:linear-gradient(90deg,#3cada6,#19819a,#16508f,#273476)}
.bar-ocean{background:linear-gradient(90deg,#3cada6,#16508f)}
.bar-mountain{background:linear-gradient(90deg,#273476,#8aa5c8)}
.bar-lava{background:linear-gradient(90deg,#15151a,#f26a2e)}
.tile{background:var(--tile);padding:16px}
.tile.photo{padding:0;overflow:hidden}
.tile.photo img{display:block;width:100%;aspect-ratio:10/7;object-fit:cover}
.tile-body{padding:22px;display:grid;gap:8px}
.tile-body p{color:var(--muted);font-size:.97rem}
.go{font-size:.82rem;letter-spacing:.2em;color:var(--link);margin-top:6px}
.swatch{display:inline-block;width:.5em;height:.5em;border-radius:50%;margin-right:.5em;vertical-align:.1em}
.sw-ocean{background:linear-gradient(135deg,#16508f,#3cada6)}
.sw-mountain{background:linear-gradient(135deg,#273476,#8aa5c8)}
.sw-lava{background:linear-gradient(135deg,#15151a,#f26a2e)}

.crumbs{display:flex;gap:10px;align-items:center;font-size:.85rem;letter-spacing:.18em;color:var(--muted)}
.crumbs a{color:var(--link)}
.page-head{display:grid;gap:14px;justify-items:start}
.page-head p:not(.eyebrow){color:var(--muted);max-width:38em}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:0;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);font-size:.88rem;line-height:1.2;letter-spacing:.12em;cursor:pointer;text-decoration:none}
.pill:hover{border-color:var(--fg)}
.pill[aria-pressed="true"],.pill[aria-current="page"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.page-band .pills{margin-top:10px}
.toolbar{display:grid;gap:18px;padding-block:28px 28px}
.range-note{color:var(--muted);font-size:.97rem}
.body-pad{padding-bottom:clamp(40px,6vw,80px)}

.card .body{padding:22px;display:grid;gap:18px}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.price{font:400 1.15rem/1 var(--font-body);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.field{display:grid;gap:8px}
.field>label{display:grid;gap:6px;font-size:.8rem;letter-spacing:.16em;color:var(--muted)}
.sel,.inp{width:100%;padding:11px 14px;border:1.5px solid var(--line-strong);border-radius:0;background:var(--surface);color:var(--fg);font:300 1rem/1.4 var(--font-body)}
textarea.inp{resize:vertical}
.actions{display:grid;gap:10px}
.card .btn,.link-tile .btn{--line-strong:#3d5f99}
:root[data-theme="light"] .card .btn:not(.primary){--line-strong:#9db9c6}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .card .btn:not(.primary){--line-strong:#9db9c6}}
.card .btn.primary,.link-tile .btn.primary{--accent:#16508f;--accent-fg:#fff;--accent-hover:#273476}
:root[data-theme="dark"] .card .btn.primary{--accent:#3cada6;--accent-fg:#04141c;--accent-hover:#7fd9d2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .btn.primary{--accent:#3cada6;--accent-fg:#04141c;--accent-hover:#7fd9d2}}
.note-box{border:1.5px dashed var(--line-strong);padding:20px;color:var(--muted);margin-top:36px}

.compare{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

.faq{display:grid;max-width:820px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:22px 40px 22px 0;position:relative;font-family:var(--font-display);font-weight:400;font-size:1.2rem;letter-spacing:.06em;line-height:1.35}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:1.5rem;color:var(--link);font-weight:300}
.faq details[open]>summary::after{content:"\2212"}
.faq .ans{padding:0 40px 24px 0;color:var(--muted);max-width:38em}
.faq-cta{margin-top:40px;display:grid;gap:16px;justify-items:start}
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,88px);align-items:start}
.portrait{aspect-ratio:4/5;max-width:100%;border:1.5px dashed var(--line-strong);background:var(--tile) center/cover no-repeat;display:grid;place-items:center;text-align:center;padding:16px}
.portrait.has{border-style:solid;border-color:var(--teal)}
.portrait-ph{display:grid;gap:14px;justify-items:center;color:var(--muted)}
.cap{margin-top:10px;font:400 .9rem var(--font-display);letter-spacing:.2em;color:var(--muted)}
.about-copy{display:grid;gap:22px;justify-items:start}
.about-copy h1{font-size:clamp(2.4rem,5.5vw,4rem)}
.about-copy p{max-width:34em;font-size:1.1rem}
.ph{border-bottom:1.5px dashed var(--teal)}

footer.site{margin-top:0}
.foot{display:flex;gap:24px 40px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-block:44px}
.foot nav{display:flex;gap:12px 28px;flex-wrap:wrap}
.foot a,.foot button.linklike{color:var(--fg);font-size:.85rem;letter-spacing:.18em;line-height:1.4;background:none;border:0;padding:0 0 2px;cursor:pointer;text-decoration:none;border-bottom:1.5px solid rgba(255,255,255,.5)}
.foot a:hover,.foot button.linklike:hover{border-bottom-color:#3cada6}
.foot .muted{font-size:.9rem}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid}
.overlay.right{justify-items:end}
.overlay.center{place-items:center;padding:16px}
.drawer{width:min(440px,100%);height:100%;background:var(--surface);color:var(--fg);border-left:1px solid var(--line);padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:18px;--muted:#a9bccb}
:root[data-theme="light"] .drawer,:root[data-theme="light"] .dialog{--muted:#4a6178}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .drawer,:root:not([data-theme="dark"]) .dialog{--muted:#4a6178}}
.drawer-head,.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:0;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);font-size:1.3rem;line-height:1;cursor:pointer}
.lines{display:grid;gap:16px;list-style:none;margin:0;padding:0}
.line{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.line .top{display:flex;justify-content:space-between;gap:12px;font-weight:400}
.line .det{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:0;border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);cursor:pointer;font-size:1rem}
.qty .n{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.linklike-btn{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;text-decoration:underline;padding:0;margin-left:auto}
.subtotal{display:flex;justify-content:space-between;font:300 1.4rem var(--font-display);font-variant-numeric:tabular-nums}
.dialog{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);padding:26px;display:grid;gap:18px;--muted:#a9bccb}
.err{color:var(--err);font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#273476;color:#fff;padding:12px 22px;font-size:.88rem;letter-spacing:.16em;z-index:70;max-width:calc(100% - 32px);border-bottom:2px solid #3cada6}


@media (max-width:820px){
  .hero,.about{grid-template-columns:1fr}
  .frame{aspect-ratio:1/.9}
  .about .portrait{max-width:380px}
}
@media (max-width:520px){
  .brand span{display:none}
  .logo.sm{height:44px;width:50px}
  nav.main a{padding:8px 6px;font-size:.74rem;letter-spacing:.12em}
  .bar{gap:8px 10px}
  .bar>.btn{padding:10px 12px;font-size:.78rem}
  .btn.lg{width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.pill,.link-tile,nav.main a{transition:background-color .2s,border-color .2s}
  .tile.photo img{transition:transform .8s ease}
  .link-tile:hover .tile.photo img{transform:scale(1.04)}
}

.steps{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.step{display:grid;gap:10px;align-content:start;border-top:1px solid var(--line-strong);padding-top:18px}
.step .n{font-family:var(--font-display);letter-spacing:.2em;font-size:.82rem;color:var(--link)}
.step p{color:var(--muted)}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-family:var(--font-display);letter-spacing:.2em}
.contact-card{display:grid;gap:26px;max-width:640px}
.contact-card .big{font:300 clamp(1.3rem,3.6vw,2rem)/1.3 var(--font-display);margin:6px 0 0;overflow-wrap:anywhere}
.maillink{color:var(--link);text-decoration:underline;text-underline-offset:5px}
.thumbs{display:flex;gap:8px;padding:10px 12px 0}
.thumb{flex:1;min-width:0;padding:0;border:1.5px solid var(--line-strong);background:transparent;cursor:pointer;color:var(--fg);font:400 .74rem/1.2 var(--font-display);letter-spacing:.08em}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.thumb span{display:block;padding:5px 4px}
.thumb[aria-pressed="true"]{border-color:var(--link);box-shadow:inset 0 -3px 0 var(--link)}
.card .tile.photo img{aspect-ratio:10/7}
.stock{display:inline-block;padding:3px 10px;border:1px solid var(--line-strong);font:400 .76rem var(--font-display);letter-spacing:.12em}
.stock.out{color:var(--muted)}
.card .note{font-size:.85rem;color:var(--muted)}

</style>
</head>

<script>
(function(){
  'use strict';
  /* ---------- Procedural artwork ---------- */
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function rng(seed){var s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
  function rot(x,y,a){var c=Math.cos(a),s=Math.sin(a),dx=x-100,dy=y-70;return[100+dx*c-dy*s,70+dx*s+dy*c];}
  function hexPts(cx,cy,r){var p=[];for(var i=0;i<6;i++){var a=Math.PI/180*(60*i);p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return '<polygon points="'+p.join(' ')+'"/>';}
  var SHAPES={
    board_rect:{base:'wood',els:['<rect x="18" y="32" width="128" height="76" rx="9"/>','<rect x="142" y="57" width="42" height="26" rx="13"/>'],hole:[170,70]},
    board_round:{base:'wood',els:['<circle cx="86" cy="70" r="54"/>','<rect x="130" y="58" width="56" height="24" rx="12"/>'],hole:[172,70]},
    board_long:{base:'wood',els:['<rect x="8" y="46" width="152" height="48" rx="8"/>','<rect x="156" y="58" width="34" height="24" rx="12"/>'],hole:[177,70]},
    platter_round:{base:'wood',els:['<circle cx="100" cy="70" r="58"/>']},
    platter_oval:{base:'wood',els:['<ellipse cx="100" cy="70" rx="86" ry="52"/>']},
    platter_rect:{base:'wood',els:['<rect x="12" y="26" width="176" height="88" rx="12"/>']},
    coaster_round:{base:'wood',els:['<circle cx="66" cy="42" r="27"/>','<circle cx="134" cy="42" r="27"/>','<circle cx="66" cy="100" r="27"/>','<circle cx="134" cy="100" r="27"/>']},
    coaster_square:{base:'wood',els:['<rect x="44" y="14" width="50" height="50" rx="6"/>','<rect x="106" y="14" width="50" height="50" rx="6"/>','<rect x="44" y="76" width="50" height="50" rx="6"/>','<rect x="106" y="76" width="50" height="50" rx="6"/>']},
    coaster_hex:{base:'wood',els:[hexPts(64,42,28),hexPts(136,42,28),hexPts(64,100,28),hexPts(136,100,28)]},
    glass_stem:{base:'glass',cy:62,els:['<path d="M72 14 C68 56 80 84 100 88 C120 84 132 56 128 14 Z"/>','<rect x="98" y="86" width="4" height="30"/>','<ellipse cx="100" cy="120" rx="26" ry="5"/>']},
    glass_stemless:{base:'glass',cy:66,els:['<path d="M62 26 L70 112 Q100 122 130 112 L138 26 Z"/>']}
  };
  var PAL={
    ocean:{edge:'#19819a',band:['#0f3a6b','#16508f','#19819a','#3cada6','#8fd9d2']},
    mountain:{edge:'#16508f',ridges:['#8aa5c8','#16508f','#273476'],bg:'#dbe6f1'},
    lava:{edge:'#f26a2e',bg:'#15151a',veins:['#c23a1c','#f26a2e','#f7b23b']}
  };
  var uid=0;
  function art(kind,range,finish){
    var S=SHAPES[kind],P=PAL[range]||PAL.ocean,id='a'+(++uid),r=rng(hash(kind+range));
    var glass=S.base==='glass',cy=S.cy||70;
    var ang=((glass?-8:-14)+(r()*10-5))*Math.PI/180;
    var a1=6+r()*8,a2=3+r()*5,f1=0.025+r()*0.02,f2=0.07+r()*0.04,p1=r()*6,p2=r()*6;
    var w0=glass?30:36+r()*10;
    function off(x){return a1*Math.sin(x*f1+p1)+a2*Math.sin(x*f2+p2);}
    function wd(x){return w0+8*Math.sin(x*0.03+p2);}
    function line(t,extra){var pts=[];for(var x=-30;x<=230;x+=5){var y=cy+off(x)+t*wd(x)+(extra?extra(x):0);var q=rot(x,y,ang);pts.push(q[0].toFixed(1)+','+q[1].toFixed(1));}return pts;}
    function region(t0,t1){return 'M'+line(t0).join('L')+'L'+line(t1).reverse().join('L')+'Z';}
    function stroke(pts,w,col,op){return '<path d="M'+pts.join('L')+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+op+'"/>';}
    var band='',i;
    if(range==='mountain'){
      band+='<path d="'+region(-0.5,0.5)+'" fill="'+P.bg+'"/>';
      var tj=[-0.12,0.06,0.24],amp=[12,14,13];
      for(i=0;i<3;i++){
        (function(j){
          var fr=0.045+r()*0.03,ph=r()*6;
          var top=line(tj[j],function(x){return -amp[j]*(1-Math.abs(Math.sin(x*fr+ph)))-3*Math.abs(Math.sin(x*fr*2.7+ph*2));});
          band+='<path d="M'+top.join('L')+'L'+line(0.7).reverse().join('L')+'Z" fill="'+P.ridges[j]+'"/>';
        })(i);
      }
    }else if(range==='lava'){
      band+='<path d="'+region(-0.5,0.5)+'" fill="'+P.bg+'"/>';
      var tv=[-0.22,0.04,0.28];
      for(i=0;i<3;i++){
        (function(j){
          var ex=function(x){return 3.5*Math.sin(x*0.13+j*2)+2*Math.sin(x*0.31+j);};
          var pts=line(tv[j],ex);
          band+=stroke(pts,8,P.veins[0],0.35)+stroke(pts,3.2,P.veins[1],0.95)+stroke(pts,1.2,P.veins[2],1);
        })(i);
      }
    }else{
      var bounds=[-0.5,-0.3,-0.05,0.18,0.36,0.5],ls=[];
      for(i=0;i<bounds.length;i++){(function(k){ls.push(line(bounds[k],function(x){return (k>0&&k<bounds.length-1)?3*Math.sin(x*0.09+k*1.7):0;}));})(i);}
      for(i=0;i<5;i++){band+='<path d="M'+ls[i].join('L')+'L'+ls[i+1].slice().reverse().join('L')+'Z" fill="'+P.band[i]+'"/>';}
      var foam=[-0.14,0.1,0.28];
      for(i=0;i<3;i++){(function(j){band+=stroke(line(foam[j],function(x){return 2.5*Math.sin(x*0.18+j*2.2);}),0.9,'#ffffff',0.85);})(i);}
    }
    var grain='';
    if(!glass){
      for(i=0;i<8;i++){var pts=[];for(var x=-10;x<=210;x+=8){pts.push(x+','+(8+i*17+3*Math.sin(x*0.05+i)).toFixed(1));}grain+='<path d="M'+pts.join('L')+'" fill="none" stroke="#7d5a2f" stroke-width="0.8" opacity="0.22"/>';}
    }
    var inner=S.els.join('');
    var edge=(finish==='resin'&&!glass)?'<g fill="none" stroke="'+P.edge+'" stroke-width="9">'+inner+'</g>':'';
    var hole=S.hole?'<circle cx="'+S.hole[0]+'" cy="'+S.hole[1]+'" r="5" fill="var(--tile)"/>':'';
    return '<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">'+
      '<defs><clipPath id="'+id+'s">'+inner+'</clipPath><clipPath id="'+id+'b"><path d="'+region(-0.5,0.5)+'"/></clipPath>'+
      '<linearGradient id="'+id+'w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6ab72"/><stop offset="1" stop-color="#b78650"/></linearGradient></defs>'+
      '<g transform="translate(3 5)" fill="#000" opacity="0.12">'+inner+'</g>'+
      '<g clip-path="url(#'+id+'s)"><rect width="200" height="140" fill="'+(glass?'#dcecf0':'url(#'+id+'w)')+'"/>'+grain+
      '<g clip-path="url(#'+id+'b)">'+band+'</g>'+edge+'</g>'+
      '<g fill="none" stroke="'+(glass?'#7fa2ae':'rgba(60,35,10,0.35)')+'" stroke-width="1">'+inner+'</g>'+hole+'</svg>';
  }


  var ROUTES=['home','shop','boards','platters','coasters','glasses','about','faqs','contact'];
  var RKEYS=['ocean','mountain','lava'];
  var FINISH={resin:{name:'Resin edges',line:'Edge: resin edges'},clean:{name:'Clean all round',line:'Edge: clean all round'}};
  var SITE=null,ORDER=[];
  var state={route:'home',range:'ocean'},sel={};
  var view=document.getElementById('view');
  var GBP=function(n){return '£'+n;};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function rich(s){return esc(s).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>');}
  function T(k){return SITE.types.filter(function(t){return t.key===k;})[0];}
  function RG(k){return SITE.ranges[k]||{name:k,blurb:''};}
  function firstName(){return String(SITE.about.name||'').trim().split(/\s+/)[0]||'';}
  function igUrl(){return 'https://www.instagram.com/'+encodeURIComponent(String(SITE.brand.instagram||'').replace(/^@/,''))+'/';}
  function igText(){return '@'+String(SITE.brand.instagram||'').replace(/^@/,'');}
  function selFor(key){return sel[key]||(sel[key]={size:0,finish:'resin'});}
  function parts(key){var a=key.split(':'),t=T(a[0]);return{t:t,s:t?t.shapes.filter(function(x){return x.id===a[1];})[0]:null};}
  function describe(key){
    var p=parts(key),st=selFor(key),size=p.s.sizes[st.size]||p.s.sizes[0],extra=[];
    if(p.t.ranges)extra.push(RG(state.range).name+' range');
    if(p.t.edges)extra.push(FINISH[st.finish].line);
    return (size.stock==='out'?'PRE-ORDER REQUEST (out of stock). ':'')+p.t.short+', '+p.s.name+', '+size.label+(extra.length?'. '+extra.join('. '):'')+'. Guide price '+GBP(size.price)+'.';
  }

  /* Netlify Image CDN resizes large uploads to a sensible width; falls back to the original file if the CDN is not available */
  function rs(src,w){if(!src||/^https?:/.test(src))return esc(src||'');var u=src.charAt(0)==='/'?src:'/'+src;return '/.netlify/images?url='+encodeURIComponent(u)+'&w='+w+'&q=80';}
  function fb(src){return ' onerror="this.onerror=null;this.src=\''+esc(src)+'\'"';}
  function ph(src,alt){return '<div class="tile photo"><img src="'+rs(src,900)+'"'+fb(src)+' alt="'+esc(alt)+'" loading="lazy"></div>';}
  function tileFor(t){return t.photo?ph(t.photo,t.name):'<div class="tile">'+art(t.tileKind,t.tileRange||'ocean','none')+'</div>';}
  function rangeTile(k){var p=SITE.images[k];return p?ph(p,RG(k).name+' range'):'<div class="tile">'+art('board_round',k,'none')+'</div>';}
  function photoIdx(sh,st){
    var ph=sh.photos||[];if(!ph.length)return -1;
    if(st.img!=null&&st.img<ph.length)return st.img;
    for(var i=0;i<ph.length;i++){if(ph[i].finish===st.finish)return i;}
    return 0;
  }
  function tileHTML(sh,t,st,rg){
    var ph=(sh.photos||[]).filter(function(p){return p&&p.src;}),k=photoIdx(sh,st);
    if(!ph.length||k<0||!sh.photos[k]||!sh.photos[k].src)return '<div class="tile">'+art(sh.kind,rg,t.edges?st.finish:'none')+'</div>';
    var cur=sh.photos[k],h=ph_tile(cur.src,sh.name+(cur.label?', '+cur.label:''));
    if(sh.photos.length>1){
      h+='<div class="thumbs">'+sh.photos.map(function(p,i){return p.src?'<button type="button" class="thumb" data-photo="'+i+'" aria-pressed="'+(i===k)+'" aria-label="Show photo: '+esc(p.label||('Photo '+(i+1)))+'"><img src="'+rs(p.src,300)+'"'+fb(p.src)+' alt=""><span>'+esc(p.label||'')+'</span></button>':'';}).join('')+'</div>';
    }
    return h;
  }
  function ph_tile(src,alt){return '<div class="tile photo"><img src="'+rs(src,900)+'"'+fb(src)+' alt="'+esc(alt)+'"></div>';}
  function finishLink(size,st){return st.finish==='clean'?(size.linkClean||''):(size.link||'');}
  function cardHTML(t,s){
    var key=t.key+':'+s.id,st=selFor(key);
    if(st.size>=s.sizes.length)st.size=0;
    var size=s.sizes[st.size]||{label:'',price:0},rg=t.ranges?state.range:'ocean',fid='f-'+t.key+'-'+s.id;
    var out=size.stock==='out';
    var h='<article class="card" data-key="'+esc(key)+'"><div class="rbar '+(t.ranges?'bar-'+rg:'bar-brand')+'"></div>'+tileHTML(s,t,st,rg)+'<div class="body">';
    h+='<div class="row"><h3>'+esc(s.name)+'</h3><p class="price">'+GBP(size.price)+'</p></div>';
    h+='<div class="field"><span class="label">'+(t.key==='coasters'||t.key==='glasses'?'Quantity':'Size')+'</span><div class="pills">';
    s.sizes.forEach(function(z,i){h+='<button type="button" class="pill" data-size="'+i+'" aria-pressed="'+(i===st.size)+'">'+esc(z.label)+(z.stock==='out'?' (pre-order)':'')+'</button>';});
    h+='</div></div>';
    if(t.edges){
      h+='<div class="field"><label for="'+fid+'">Edge finish</label><select class="sel" id="'+fid+'" data-finish>';
      Object.keys(FINISH).forEach(function(k){h+='<option value="'+k+'"'+(k===st.finish?' selected':'')+'>'+FINISH[k].name+'</option>';});
      h+='</select></div>';
    }
    h+='<p><span class="stock'+(out?' out':'')+'">'+(out?'Out of stock, pre-order available':'In stock')+'</span></p>';
    var link=finishLink(size,st);
    if(out){
      h+='<div class="actions"><button type="button" class="btn primary" data-req="preorder">Pre-order request</button></div><p class="note">This piece is being made. Send a request and we confirm timing and send a secure payment link.</p>';
    }else if(link){
      h+='<div class="actions"><a class="btn primary" href="'+esc(link)+'" target="_blank" rel="noopener">Buy now</a></div><p class="note">Secure payment by card, Apple Pay or Google Pay through Revolut. Illustration shown, every piece differs.</p>';
    }else{
      h+='<div class="actions"><button type="button" class="btn primary" data-req="order">Order this piece</button></div><p class="note">We email you a secure payment link. Illustration shown, every piece differs.</p>';
    }
    return h+'</div></article>';
  }
  function typeNav(cur){
    return '<div class="pills" role="navigation" aria-label="Product types">'+ORDER.map(function(k){return '<a class="pill" href="#'+k+'" data-go="'+k+'"'+(k===cur?' aria-current="page"':'')+'>'+esc(T(k).name)+'</a>';}).join('')+'</div>';
  }
  var LOGO='<svg class="band-logo" viewBox="0 0 283.46 249.69" aria-hidden="true"><use href="#otl-logo"/></svg>';
  function band(cls,inner,extra){return '<section class="band '+cls+'">'+(extra||'')+'<div class="wrap">'+inner+'</div></section>';}
  function plain(inner){return '<section class="sec"><div class="wrap">'+inner+'</div></section>';}
  function heroHTML(){
    var H=SITE.hero,I=SITE.images;
    var main=I.hero?'<img class="cover" src="'+rs(I.hero,1400)+'"'+fb(I.hero)+' alt="Handmade boards with ocean resin waves">':'<div class="cover tile">'+art('board_round','ocean','resin')+'</div>';
    var corner=I.heroCorner?'<img class="a2" src="'+rs(I.heroCorner,700)+'"'+fb(I.heroCorner)+' alt="Close up of a board with a teal and white resin wave">':'';
    var h='<div class="hero"><div class="hero-copy"><p class="eyebrow">'+esc(H.eyebrow)+'</p><h1>'+esc(H.line1)+'<br><em>'+esc(H.line2)+'</em></h1><p class="lead">'+esc(H.lead)+'</p>'+
      '<div class="cta"><a class="btn primary lg" href="#shop" data-go="shop">Shop the range</a></div></div>'+
      '<div class="hero-art"><div class="frame">'+main+corner+'</div></div></div>';
    return '<section class="band hero-band">'+LOGO+'<div class="wrap">'+h+'</div></section>';
  }
  function homeHTML(){
    var h=heroHTML()+'<div class="stripe"></div>';
    var types='<div class="sec-head"><div><p class="eyebrow">The shop</p><h2>Shop by product</h2></div><p>Four types of piece, each in a choice of shapes and sizes.</p></div><div class="grid">';
    ORDER.forEach(function(k){var t=T(k);types+='<a class="link-tile" href="#'+k+'" data-go="'+k+'"><div class="rbar bar-brand"></div>'+tileFor(t)+'<div class="tile-body"><h3>'+esc(t.name)+'</h3><p>'+esc(t.blurb)+'</p><span class="go">shop '+esc(t.name.toLowerCase())+'</span></div></a>';});
    h+=plain(types+'</div>');
    var rng='<div class="sec-head"><div><p class="eyebrow">Ranges</p><h2>Choose a range</h2></div><p>Pick a range, then choose the product type, shape and size.</p></div><div class="grid">';
    RKEYS.forEach(function(k){rng+='<a class="link-tile" href="#boards" data-go="boards" data-range="'+k+'"><div class="rbar bar-'+k+'"></div>'+rangeTile(k)+'<div class="tile-body"><h3><span class="swatch sw-'+k+'"></span>'+esc(RG(k).name)+'</h3><p>'+esc(RG(k).blurb)+'</p><span class="go">see '+esc(RG(k).name.toLowerCase())+' pieces</span></div></a>';});
    h+=band('blue',rng+'</div>');
    var O=SITE.ordering;
    var ord='<div class="sec-head"><div><p class="eyebrow">Ordering</p><h2>'+esc(O.title)+'</h2></div><p>'+esc(O.intro)+'</p></div><div class="steps">';
    O.steps.forEach(function(s,i){ord+='<div class="step"><span class="n">step '+(i+1)+'</span><h3>'+esc(s.title)+'</h3><p>'+rich(s.text)+'</p></div>';});
    h+=band('teal',ord+'</div>');
    var ed='<div class="sec-head"><div><p class="eyebrow">Every piece differs</p><h2>Resin edges or clean edges</h2></div><p>Choose resin edges or clean edges from the drop-down on any board or platter. You will see the choice in the product picture.</p></div><div class="compare">';
    ed+='<div class="link-tile" style="cursor:default"><div class="rbar bar-brand"></div>'+(SITE.images.edgeResin?ph(SITE.images.edgeResin,'Side of a board showing resin running down the edge'):'<div class="tile">'+art('board_rect','ocean','resin')+'</div>')+'<div class="tile-body"><h3>Resin edges</h3><p>Resin runs down the sides as well as through the middle.</p></div></div>';
    ed+='<div class="link-tile" style="cursor:default"><div class="rbar bar-brand"></div>'+(SITE.images.edgeClean?ph(SITE.images.edgeClean,'Board with natural timber edges and a resin wave at one end'):'<div class="tile">'+art('board_rect','ocean','clean')+'</div>')+'<div class="tile-body"><h3>Clean all round</h3><p>Timber edges all the way round, with the resin kept to the centre.</p></div></div>';
    h+=plain(ed+'</div>');
    return h;
  }
  function shopHTML(){
    var h=band('page-band','<div class="page-head"><p class="eyebrow">The shop</p><h1>Shop</h1><p>Choose a type of piece. Each comes in a choice of shapes and sizes, and most come in the Ocean, Mountain and Lava ranges.</p></div>',LOGO);
    var g='<div class="grid">';
    ORDER.forEach(function(k){var t=T(k);g+='<a class="link-tile" href="#'+k+'" data-go="'+k+'"><div class="rbar bar-brand"></div>'+tileFor(t)+'<div class="tile-body"><h3>'+esc(t.name)+'</h3><p>'+esc(t.blurb)+'</p><span class="go">view '+t.shapes.length+' shape'+(t.shapes.length===1?'':'s')+'</span></div></a>';});
    return h+'<div class="stripe"></div>'+plain(g+'</div>');
  }
  function typeHTML(k){
    var t=T(k);
    var head='<nav class="crumbs" aria-label="Breadcrumb"><a href="#shop" data-go="shop">Shop</a><span aria-hidden="true">/</span><span>'+esc(t.name)+'</span></nav><div class="page-head" style="margin-top:18px"><p class="eyebrow">Shop</p><h1>'+esc(t.name)+'</h1><p>'+esc(t.blurb)+'</p>'+typeNav(k)+'</div>';
    var h=band('page-band',head,LOGO)+'<div class="stripe"></div><div class="wrap body-pad"><div class="toolbar">';
    if(t.ranges){
      h+='<div class="field"><span class="label">Range</span><div class="pills">';
      RKEYS.forEach(function(r){h+='<button type="button" class="pill" data-range-pick="'+r+'" aria-pressed="'+(r===state.range)+'"><span class="swatch sw-'+r+'"></span>'+esc(RG(r).name)+'</button>';});
      h+='</div><p class="range-note">'+esc(RG(state.range).blurb)+'</p></div>';
    }
    h+='</div><div class="grid products" id="products">'+t.shapes.map(function(s){return cardHTML(t,s);}).join('')+'</div>';
    h+='<div class="note-box">Each piece is handmade, so no two are identical. Choose your shape, size and edge finish, then order. We email you a secure payment link and post your piece once it is paid.</div></div>';
    return h;
  }
  function aboutHTML(){
    var p=SITE.about.photo;
    var photo=p?'<div class="portrait has" style="background-image:url(\''+rs(p,900)+'\')" role="img" aria-label="Photo of '+esc(SITE.about.name)+'"></div>':
      '<div class="portrait"><div class="portrait-ph"><span class="label">Photo of '+esc(firstName())+' goes here</span></div></div>';
    var h='<div class="wrap body-pad"><section class="about" style="padding-block:clamp(44px,7vw,92px) 0"><div>'+photo+'<p class="cap">'+esc(SITE.about.name)+'</p></div><div class="about-copy"><p class="eyebrow">About</p><h1>Hello, I’m '+esc(firstName())+'.</h1>'+
      '<p>'+rich(SITE.about.p1)+'</p><p>'+rich(SITE.about.p2)+'</p><p>'+rich(SITE.about.p3)+'</p>'+
      '<div class="cta"><a class="btn primary" href="#shop" data-go="shop">Shop the range</a><a class="btn" href="'+igUrl()+'" target="_blank" rel="noopener">Follow '+esc(igText())+'</a></div></div></section></div>';
    return band('page-band','<div class="page-head"><p class="eyebrow">About</p><h2 style="font-size:clamp(1.9rem,4.4vw,3rem)">The maker</h2></div>',LOGO)+'<div class="stripe"></div>'+h;
  }
  function faqsHTML(){
    var head='<div class="page-head"><p class="eyebrow">FAQs</p><h1>Questions</h1><p>Answers to the questions we are asked most. If yours is not here, ask and we will get back to you.</p></div>';
    var list='<div class="faq">'+SITE.faqs.map(function(f){return '<details><summary>'+esc(f.q)+'</summary><div class="ans">'+rich(f.a)+'</div></details>';}).join('')+'</div>';
    var cta='<div class="faq-cta"><h3>Still have a question?</h3><div class="cta"><a class="btn primary" href="'+igUrl()+'" target="_blank" rel="noopener">Message '+esc(igText())+'</a></div></div>';
    return band('page-band',head,LOGO)+'<div class="stripe"></div><div class="wrap body-pad"><div style="padding-top:clamp(28px,5vw,56px)">'+list+cta+'</div></div>';
  }
  function mailLink(cls){var e=SITE.brand.email;return e?'<a class="'+cls+'" href="mailto:'+esc(e)+'">'+esc(e)+'</a>':'<span class="ph">[Email address to be added]</span>';}
  function contactHTML(){
    var C=SITE.contact||{};
    var head='<div class="page-head"><p class="eyebrow">Contact</p><h1>'+esc(C.title||'Contact me')+'</h1><p>'+esc(C.intro||'')+'</p></div>';
    var body='<div class="contact-card"><div><span class="label">Email</span><p class="big">'+mailLink('maillink')+'</p></div>'+
      '<div><span class="label">Instagram</span><p class="big"><a class="maillink" href="'+igUrl()+'" target="_blank" rel="noopener">'+esc(igText())+'</a></p></div>'+
      (C.note?'<p class="muted">'+rich(C.note)+'</p>':'')+
      '<div class="cta">'+(SITE.brand.email?'<a class="btn primary" href="mailto:'+esc(SITE.brand.email)+'">Email me</a>':'')+'<a class="btn" href="#shop" data-go="shop">Shop the range</a></div></div>';
    return band('page-band',head,LOGO)+'<div class="stripe"></div><div class="wrap body-pad"><div style="padding-top:clamp(28px,5vw,56px)">'+body+'</div></div>';
  }
  function renderChrome(){
    document.getElementById('brand-name').textContent=SITE.brand.name;
    var f=document.getElementById('foot-insta');f.href=igUrl();f.textContent='Instagram '+igText();
    var fm=document.getElementById('foot-mail');if(fm){if(SITE.brand.email){fm.href='mailto:'+SITE.brand.email;fm.textContent=SITE.brand.email;fm.style.display='';}else fm.style.display='none';}
  }
  function render(){
    var r=state.route,h;
    if(r==='home')h=homeHTML();else if(r==='shop')h=shopHTML();else if(r==='about')h=aboutHTML();else if(r==='faqs')h=faqsHTML();else if(r==='contact')h=contactHTML();else h=typeHTML(r);
    if(modal&&!modal.hidden)closeModal();
    view.innerHTML=h;
    document.querySelectorAll('[data-nav]').forEach(function(a){
      if(a.dataset.nav===r||(a.dataset.nav==='shop'&&ORDER.indexOf(r)>-1))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
    });
    renderChrome();
  }
  function go(r){
    if(ROUTES.indexOf(r)<0)r='home';
    state.route=r;render();window.scrollTo(0,0);
    try{if(location.hash.slice(1)!==r)location.hash=r;}catch(e){}
  }
  function refreshCard(key,focusSel){
    var el=view.querySelector('.card[data-key="'+key+'"]');if(!el)return;
    var p=parts(key),tmp=document.createElement('div');tmp.innerHTML=cardHTML(p.t,p.s);
    el.replaceWith(tmp.firstChild);
    if(focusSel){var f=view.querySelector('.card[data-key="'+key+'"] '+focusSel);if(f)f.focus();}
  }

  /* ---------- Order form (sent through Netlify Forms) ---------- */
  var lastFocus=null,modal=document.getElementById('modal');
  function openModal(text,showFinish,finish,kind){
    kind=kind==='preorder'?'preorder':'order';modal.dataset.kind=kind;
    document.getElementById('m-title').textContent=kind==='preorder'?'Pre-order request':'Order this piece';
    document.getElementById('rq-send').textContent=kind==='preorder'?'Send pre-order request':'Send order';
    document.getElementById('rq-lead').textContent=kind==='preorder'?'This piece is out of stock. Send your details and we will confirm when it can be made, then email you a secure payment link.':'Send your details and we will email you a secure payment link. Every piece is handmade, so there may be small differences from the illustration.';
    lastFocus=document.activeElement;
    document.getElementById('rq-item').value=text;
    document.getElementById('rq-finish-wrap').hidden=!showFinish;
    document.getElementById('rq-finish').value=finish||'none';
    document.getElementById('rq-err').hidden=true;
    document.getElementById('reqForm').hidden=false;
    document.getElementById('rq-done').hidden=true;
    modal.hidden=false;
    document.getElementById('rq-name').focus();
  }
  function closeModal(){modal.hidden=true;if(lastFocus&&lastFocus.focus){try{lastFocus.focus();}catch(e){}}}
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-go],[data-size],[data-photo],[data-req],[data-range-pick],[data-close]');
    if(!el){if(e.target.id==='modal')closeModal();return;}
    var card=el.closest('.card'),key=card?card.dataset.key:null;
    if(el.hasAttribute('data-close')){closeModal();return;}
    if(el.hasAttribute('data-go')){e.preventDefault();if(el.dataset.range)state.range=el.dataset.range;go(el.dataset.go);return;}
    if(el.hasAttribute('data-size')){selFor(key).size=+el.dataset.size;refreshCard(key,'[data-size="'+el.dataset.size+'"]');return;}
    if(el.hasAttribute('data-range-pick')){state.range=el.dataset.rangePick;render();var b=view.querySelector('[data-range-pick="'+state.range+'"]');if(b)b.focus();return;}
    if(el.hasAttribute('data-photo')){selFor(key).img=+el.dataset.photo;refreshCard(key,'[data-photo="'+el.dataset.photo+'"]');return;}
    if(el.hasAttribute('data-req')){var p=parts(key);openModal(describe(key),p.t.edges,selFor(key).finish,el.dataset.req);return;}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.matches&&t.matches('[data-finish]')){var key=t.closest('.card').dataset.key;selFor(key).finish=t.value;selFor(key).img=null;refreshCard(key,'[data-finish]');}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  document.getElementById('reqForm').addEventListener('submit',function(e){
    e.preventDefault();
    var name=document.getElementById('rq-name').value.trim(),mail=document.getElementById('rq-email').value.trim(),err=document.getElementById('rq-err'),btn=document.getElementById('rq-send');
    if(!name){err.textContent='Enter your name so we know who to reply to.';err.hidden=false;document.getElementById('rq-name').focus();return;}
    if(!/^\S+@\S+\.\S+$/.test(mail)){err.textContent='Enter a valid email address so we can send your payment link.';err.hidden=false;document.getElementById('rq-email').focus();return;}
    err.hidden=true;btn.disabled=true;btn.textContent='Sending';
    var body=new URLSearchParams({'form-name':'order','bot-field':'',kind:modal.dataset.kind||'order',name:name,email:mail,item:document.getElementById('rq-item').value,
      finish:document.getElementById('rq-finish-wrap').hidden?'':document.getElementById('rq-finish').value,note:document.getElementById('rq-note').value});
    fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()}).then(function(r){
      if(!r.ok)throw new Error('bad');
      document.getElementById('reqForm').hidden=true;document.getElementById('rq-done').hidden=false;document.getElementById('reqForm').reset();
    }).catch(function(){
      err.textContent='Your order did not send. Please try again, or message us on Instagram.';err.hidden=false;
    }).then(function(){btn.disabled=false;btn.textContent=modal.dataset.kind==='preorder'?'Send pre-order request':'Send order';});
  });
  window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(SITE&&ROUTES.indexOf(h)>-1&&h!==state.route){state.route=h;render();window.scrollTo(0,0);}});

  /* ---------- Start ---------- */
  var route='home';
  try{var h0=location.hash.slice(1);if(ROUTES.indexOf(h0)>-1)route=h0;}catch(e){}
  fetch('content/site.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('missing');return r.json();}).then(function(d){
    SITE=d;ORDER=SITE.types.map(function(t){return t.key;});
    state.route=route;render();
  }).catch(function(){
    view.innerHTML='<div class="loading">this page could not load. please refresh.</div>';
  });
})();
</script>
</body>
</html>
