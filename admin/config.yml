backend:
  name: github
  repo: emilyidili/outside-the-lines   # replace OWNER with the GitHub account that holds the repo
  branch: main
  base_url: https://api.netlify.com   # Netlify OAuth provider (set up in Netlify: Site settings, Access control, OAuth)
  auth_endpoint: auth

site_url: https://outsidethelines.uk
display_url: https://outsidethelines.uk

media_folder: img/uploads
public_folder: /img/uploads

collections:
  - name: site
    label: Website content
    files:
      - name: content
        label: All pages
        file: content/site.json
        format: json
        fields:
          - label: Brand
            name: brand
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Instagram handle, name: instagram, widget: string }
              - { label: Contact email address, name: email, widget: string, required: false }
          - label: Home page intro
            name: hero
            widget: object
            fields:
              - { label: Small line above title, name: eyebrow, widget: string }
              - { label: Title line 1, name: line1, widget: string }
              - { label: Title line 2, name: line2, widget: string }
              - { label: Intro text, name: lead, widget: text }
          - label: About page
            name: about
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Photo, name: photo, widget: image, required: false }
              - { label: Paragraph 1, name: p1, widget: text }
              - { label: Paragraph 2, name: p2, widget: text }
              - { label: Paragraph 3, name: p3, widget: text }
          - label: Contact page
            name: contact
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Note, name: note, widget: text, required: false }
          - label: How ordering works
            name: ordering
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Intro, name: intro, widget: text }
              - label: Steps
                name: steps
                widget: list
                fields:
                  - { label: Step title, name: title, widget: string }
                  - { label: Step text, name: text, widget: text }
          - label: Ranges
            name: ranges
            widget: object
            fields:
              - label: Ocean
                name: ocean
                widget: object
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: blurb, widget: text }
              - label: Mountain
                name: mountain
                widget: object
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: blurb, widget: text }
              - label: Sunset
                name: sunset
                widget: object
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: blurb, widget: text }
          - label: Photos
            name: images
            widget: object
            fields:
              - { label: Home page main photo, name: hero, widget: image, required: false }
              - { label: Home page small photo, name: heroCorner, widget: image, required: false }
              - { label: Ocean range photo, name: ocean, widget: image, required: false }
              - { label: Mountain range photo, name: mountain, widget: image, required: false }
              - { label: Sunset range photo, name: sunset, widget: image, required: false }
              - { label: Resin edge photo, name: edgeResin, widget: image, required: false }
              - { label: Clean edge photo, name: edgeClean, widget: image, required: false }
          - label: All other wording (buttons, headings, notes, messages)
            name: text
            widget: object
            collapsed: true
            summary: "Edit any wording on the site"
            fields:
              - { label: "Menu: Home", name: navHome, widget: string, required: false }
              - { label: "Menu: Shop", name: navShop, widget: string, required: false }
              - { label: "Menu: About", name: navAbout, widget: string, required: false }
              - { label: "Menu: FAQs", name: navFaqs, widget: string, required: false }
              - { label: "Menu: Contact", name: navContact, widget: string, required: false }
              - { label: "Footer: Instagram label", name: footInsta, widget: string, required: false }
              - { label: "Home: main button", name: heroCta, widget: string, required: false }
              - { label: "Home: shop section small heading", name: homeShopEyebrow, widget: string, required: false }
              - { label: "Home: shop section title", name: homeShopTitle, widget: string, required: false }
              - { label: "Home: shop section text", name: homeShopText, widget: text, required: false }
              - { label: "Product tile link, {name} is the product name", name: goShop, widget: string, required: false }
              - { label: "Home: ranges small heading", name: homeRangesEyebrow, widget: string, required: false }
              - { label: "Home: ranges title", name: homeRangesTitle, widget: string, required: false }
              - { label: "Home: ranges text", name: homeRangesText, widget: text, required: false }
              - { label: "Range tile link, {range} is the range name", name: goRange, widget: string, required: false }
              - { label: "Home: ordering small heading", name: orderingEyebrow, widget: string, required: false }
              - { label: "Home: word before step number", name: stepWord, widget: string, required: false }
              - { label: "Home: edge section small heading", name: edgeEyebrow, widget: string, required: false }
              - { label: "Home: edge section title", name: edgeTitle, widget: string, required: false }
              - { label: "Home: edge section text", name: edgeText, widget: text, required: false }
              - { label: "Resin edges title", name: resinTitle, widget: string, required: false }
              - { label: "Resin edges text", name: resinText, widget: text, required: false }
              - { label: "Clean edges title", name: cleanTitle, widget: string, required: false }
              - { label: "Clean edges text", name: cleanText, widget: text, required: false }
              - { label: "Shop page: small heading", name: shopEyebrow, widget: string, required: false }
              - { label: "Shop page: title", name: shopTitle, widget: string, required: false }
              - { label: "Shop page: text", name: shopText, widget: text, required: false }
              - { label: "Shop tile link when a product has one shape", name: viewOne, widget: string, required: false }
              - { label: "Shop tile link, {n} is the number of shapes", name: viewMany, widget: string, required: false }
              - { label: "Product page: breadcrumb start", name: crumbShop, widget: string, required: false }
              - { label: "Product page: small heading", name: typeEyebrow, widget: string, required: false }
              - { label: "Product page: range picker label", name: rangeLabel, widget: string, required: false }
              - { label: "Size button tag for out of stock sizes", name: preorderTag, widget: string, required: false }
              - { label: "Personalisation: first choice", name: noPers, widget: string, required: false }
              - { label: "Personalisation: second choice", name: persYes, widget: string, required: false }
              - { label: "Personalisation: message if the box is empty", name: persErr, widget: string, required: false }
              - { label: "Personalisation: word after the character count", name: charsWord, widget: string, required: false }
              - { label: "Stock label: in stock", name: stockIn, widget: string, required: false }
              - { label: "Stock label: out of stock", name: stockOut, widget: string, required: false }
              - { label: "Button: buy now", name: buyBtn, widget: string, required: false }
              - { label: "Note under Buy now", name: buyNote, widget: text, required: false }
              - { label: "Button: order form", name: orderBtn, widget: string, required: false }
              - { label: "Note under the order button", name: orderNote, widget: text, required: false }
              - { label: "Button: pre-order", name: preorderBtn, widget: string, required: false }
              - { label: "Note under the pre-order button", name: preorderNote, widget: text, required: false }
              - { label: "Product page: note at the bottom", name: pageNote, widget: text, required: false }
              - { label: "About page: small heading", name: aboutEyebrow, widget: string, required: false }
              - { label: "About page: title", name: aboutTitle, widget: string, required: false }
              - { label: "About page: greeting, {name} is the first name", name: aboutHello, widget: string, required: false }
              - { label: "About page: Instagram button, {handle} is the handle", name: followBtn, widget: string, required: false }
              - { label: "FAQs: small heading", name: faqEyebrow, widget: string, required: false }
              - { label: "FAQs: title", name: faqTitle, widget: string, required: false }
              - { label: "FAQs: intro text", name: faqIntro, widget: text, required: false }
              - { label: "FAQs: bottom heading", name: faqStill, widget: string, required: false }
              - { label: "FAQs: bottom button, {handle} is the handle", name: faqBtn, widget: string, required: false }
              - { label: "Contact: small heading", name: contactEyebrow, widget: string, required: false }
              - { label: "Contact: email label", name: emailLabel, widget: string, required: false }
              - { label: "Contact: Instagram label", name: instaLabel, widget: string, required: false }
              - { label: "Contact: email button", name: emailBtn, widget: string, required: false }
              - { label: "Order form: title", name: formOrderTitle, widget: string, required: false }
              - { label: "Pre-order form: title", name: formPreorderTitle, widget: string, required: false }
              - { label: "Order form: intro", name: formOrderLead, widget: text, required: false }
              - { label: "Pre-order form: intro", name: formPreorderLead, widget: text, required: false }
              - { label: "Order form: product label", name: fieldProduct, widget: string, required: false }
              - { label: "Order form: name label", name: fieldName, widget: string, required: false }
              - { label: "Order form: email label", name: fieldEmail, widget: string, required: false }
              - { label: "Order form: note label", name: fieldNote, widget: string, required: false }
              - { label: "Order form: send button", name: sendOrder, widget: string, required: false }
              - { label: "Pre-order form: send button", name: sendPreorder, widget: string, required: false }
              - { label: "Order form: while sending", name: sending, widget: string, required: false }
              - { label: "Order form: missing name message", name: errName, widget: string, required: false }
              - { label: "Order form: bad email message", name: errEmail, widget: string, required: false }
              - { label: "Order form: failed to send message", name: errSend, widget: string, required: false }
              - { label: "Order sent: title", name: doneTitle, widget: string, required: false }
              - { label: "Order sent: text", name: doneText, widget: text, required: false }
              - { label: "Order sent: close button", name: closeBtn, widget: string, required: false }
          - label: Shop product groups (add, hide or remove groups here)
            name: types
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Key (short lowercase word, no spaces, do not change once live), name: key, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Hide this group from the website, name: hidden, widget: boolean, default: false, required: false }
              - { label: Short line, name: short, widget: string }
              - { label: Description, name: blurb, widget: text }
              - { label: Offer ranges for this group (master switch), name: ranges, widget: boolean, required: false }
              - { label: Ranges available for this group (untick a range to turn it off for this group), name: rangeList, widget: select, multiple: true, required: false, options: [{label: Ocean, value: ocean}, {label: Mountain, value: mountain}, {label: Sunset, value: sunset}], default: [ocean, mountain, sunset] }
              - { label: Label for the size choice (for example Size or Quantity), name: sizeLabel, widget: string, default: Size, required: false }
              - { label: Group photo, name: photo, widget: image, required: false }
              - { label: Group picture style when there is no photo, name: tileKind, widget: select, default: none, required: false, options: [none, board_rect, board_round, board_long, platter_round, platter_oval, platter_rect, coaster_round, coaster_square, coaster_hex, glass_stem, glass_stemless] }
              - { label: Group picture colour, name: tileRange, widget: select, default: ocean, required: false, options: [ocean, mountain, sunset] }
              - label: Options for this group (switch each on or off)
                name: options
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Key (short lowercase word, no spaces. Use edge for resin or clean edges so the picture changes), name: id, widget: string }
                  - { label: Name shown to customers (for example Edge finish), name: label, widget: string }
                  - { label: Type, name: kind, widget: select, default: choice, options: [{label: Choice list (customer picks one), value: choice}, {label: Personalisation (No or Yes, then a text box), value: personalisation}] }
                  - { label: Switched on, name: enabled, widget: boolean, default: true }
                  - label: Choices (for Choice list only)
                    name: choices
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Choice name shown to customers, name: label, widget: string }
                      - { label: Short key (lowercase, no spaces, used to match photos), name: value, widget: string }
                      - { label: Extra price in pounds for this choice (0 for none), name: extra, widget: number, value_type: float, default: 0, min: 0, required: false }
                  - { label: Extra price in pounds when personalisation is chosen (0 for none), name: extra, widget: number, value_type: float, default: 0, min: 0, required: false }
                  - { label: Maximum characters for the personalisation text, name: maxLength, widget: number, value_type: int, default: 40, min: 1, max: 200, required: false }
                  - { label: Personalisation box heading, name: prompt, widget: string, default: Text to add, required: false }
              - label: Shapes
                name: shapes
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Id (do not change once live), name: id, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Picture style when there is no photo, name: kind, widget: select, default: none, required: false, options: [none, board_rect, board_round, board_long, platter_round, platter_oval, platter_rect, coaster_round, coaster_square, coaster_hex, glass_stem, glass_stemless] }
                  - label: Product photos (add as many as you like)
                    name: photos
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Photo, name: src, widget: image }
                      - { label: Caption (for example Resin edges), name: label, widget: string, required: false }
                      - { label: Show this photo when the customer picks this choice key (type any to always allow), name: finish, widget: string, default: any, required: false }
                  - label: Sizes
                    name: sizes
                    widget: list
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Size, name: label, widget: string }
                      - { label: Price in pounds, name: price, widget: number, value_type: int }
                      - { label: Stock, name: stock, widget: select, options: [{label: In stock, value: in}, {label: Out of stock (pre-order), value: out}], default: in }
                      - { label: Revolut payment link (resin edges, or the only option), name: link, widget: string, required: false }
                      - { label: Revolut payment link for clean edges, name: linkClean, widget: string, required: false }
          - label: FAQs
            name: faqs
            widget: list
            fields:
              - { label: Question, name: q, widget: string }
              - { label: Answer, name: a, widget: text }
